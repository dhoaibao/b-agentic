name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

# One release at a time: two pushes to main must not race on the same
# derived ordinal tag.
concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The release tag is $(cat VERSION).N where N is one plus the number of
      # existing remote tags for that date, so every push to main gets its own
      # release while VERSION and the changelog keep one bare dated section
      # per day. The date base comes from the committed VERSION file, never
      # from the runner clock.
      - name: Resolve release version
        run: |
          set -euo pipefail
          BASE="$(cat VERSION)"
          if [[ ! "$BASE" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}$ ]]; then
            echo "VERSION must be a bare vYYYY.MM.DD date, got: $BASE" >&2
            exit 1
          fi
          n="$(git ls-remote --tags --refs origin "refs/tags/${BASE}.*" \
            | awk '{print $2}' | sort -u | wc -l)"
          RELEASE_VERSION="${BASE}.$((n + 1))"
          if git ls-remote --tags origin "refs/tags/${RELEASE_VERSION}" | grep -q .; then
            echo "release tag already exists: $RELEASE_VERSION" >&2
            exit 1
          fi
          echo "BASE_VERSION=$BASE" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
      # Gates run on the pristine tree, before the VERSION stamp, so the
      # changelog validation still sees the committed VERSION equal to the
      # newest CHANGELOG heading.
      - name: Check shell syntax
        run: bash -n install.sh scripts/build-release.sh scripts/extract-release-notes.sh
      - name: Validate repository
        run: bash scripts/validate-skills.sh --release
      - name: Run installer smoke suite
        run: bash scripts/smoke-install.sh
      - name: Run structural suite audit
        run: bash scripts/b-agentic-audit.sh --skip-preflight
      # Stamp only the runner copy so the shipped payload self-identifies with
      # the exact release version. The workflow never commits or pushes to
      # main; VERSION stays vYYYY.MM.DD in the repository.
      - name: Stamp release version
        run: printf '%s\n' "$RELEASE_VERSION" > VERSION
      - name: Build release bundle
        run: bash scripts/build-release.sh dist
      - name: Extract release notes
        run: bash scripts/extract-release-notes.sh "$BASE_VERSION" CHANGELOG.md > dist/release-notes.md
      # gh release create creates the tag itself, so no git push is needed and
      # the GITHUB_TOKEN-triggered-tag rule cannot suppress another workflow.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$RELEASE_VERSION"
          --target "$GITHUB_SHA"
          --title "b-agentic $RELEASE_VERSION"
          --notes-file dist/release-notes.md
          dist/b-agentic.tar.gz
          dist/b-agentic.tar.gz.sha256
