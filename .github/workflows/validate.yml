name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python quality tools
        run: python -m pip install --requirement requirements-dev-quality.txt --disable-pip-version-check
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked repository development tools
        run: npm ci --no-fund --no-audit
      - name: Run repository quality checks
        run: npm run quality
      - name: Run native Pi validation suite
        run: bash scripts/validate-skills.sh --release
      - name: Run structural suite audit
        run: bash scripts/b-agentic-audit.sh --skip-preflight
