name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install Bash 4.4+ on macOS
        if: runner.os == 'macOS'
        run: |
          brew install bash
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Python quality tools
        run: python -m pip install --requirement requirements-dev-quality.txt --disable-pip-version-check
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      # Node stays for the Codex plugin's own script (the hooks probe fakes it).
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install locked repository development tools
        run: bun install --frozen-lockfile
      - name: Run repository quality checks
        run: bun run quality
      - name: Run Claude Code validation suite
        run: bash scripts/validate-skills.sh --release
      - name: Run structural suite audit
        run: bash scripts/b-agentic-audit.sh --skip-preflight
