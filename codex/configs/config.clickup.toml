[mcp_servers.clickup]
command = "bunx"
args = ["@hauptsache.net/clickup-mcp@1.9.0"]
env_vars = ["CLICKUP_API_KEY", "CLICKUP_TEAM_ID"]
default_tools_approval_mode = "prompt"

[mcp_servers.clickup.tools.getTaskById]
approval_mode = "approve"

[mcp_servers.clickup.tools.searchTasks]
approval_mode = "approve"

[mcp_servers.clickup.tools.readDocument]
approval_mode = "approve"

[mcp_servers.clickup.tools.getListInfo]
approval_mode = "approve"

[mcp_servers.clickup.tools.searchSpaces]
approval_mode = "approve"

[mcp_servers.clickup.tools.getTimeEntries]
approval_mode = "approve"

[mcp_servers.clickup.tools.updateTask]
approval_mode = "prompt"

[mcp_servers.clickup.tools.addComment]
approval_mode = "prompt"

[mcp_servers.clickup.tools.editComment]
approval_mode = "prompt"

[mcp_servers.clickup.tools.createTask]
approval_mode = "prompt"

[mcp_servers.clickup.tools.updateListInfo]
approval_mode = "prompt"

[mcp_servers.clickup.tools.createTimeEntry]
approval_mode = "prompt"

[mcp_servers.clickup.tools.updateDocumentPage]
approval_mode = "prompt"

[mcp_servers.clickup.tools.createDocumentOrPage]
approval_mode = "prompt"
