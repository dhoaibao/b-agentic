{
  "schema_version": 1,
  "format": "json-subset-of-yaml",
  "skills": [
    {
      "name": "b-plan",
      "phase": "Decide",
      "use": "Figure out what to do when scope or approach is fuzzy, then produce an execution-ready plan",
      "routing": {
        "intent": "Clarify fuzzy work, compare approaches, decompose execution",
        "triggers": [
          "plan",
          "decompose",
          "approach",
          "explore",
          "not sure",
          "figure out",
          "\"how should I\"",
          "implementation plan",
          "clarify",
          "requirements",
          "scope"
        ]
      },
      "prompt": {
        "description": "Turn goals into execution-ready plans. Handles both underspecified requests and fuzzy problem statements by investigating enough to compare options, choose a path, and write ordered steps. Unlike b-implement, b-plan does not change code."
      }
    },
    {
      "name": "b-research",
      "phase": "Decide",
      "use": "Fetch outside truth: docs, API facts, comparisons, or recent evidence",
      "routing": {
        "intent": "External docs, API facts, versions, comparisons",
        "triggers": [
          "library docs",
          "API docs",
          "look up",
          "compare APIs",
          "versioned docs",
          "external documentation"
        ]
      },
      "prompt": {
        "description": "External knowledge, from quick lookup to multi-source synthesis, for library/framework docs, API facts, config keys, method signatures, comparisons, deep dives, or recency-sensitive topics. Auto-detects depth, answers with sources, and hands off to implementation when the next action is obvious. Unlike b-debug or b-plan, it fetches docs and web information rather than tracing code or choosing implementation."
      }
    },
    {
      "name": "b-design",
      "phase": "Decide",
      "use": "Create or refresh docs/DESIGN.md as a frontend design standard",
      "routing": {
        "intent": "Frontend design standard and docs/DESIGN.md authoring",
        "triggers": [
          "DESIGN.md",
          "frontend design standard",
          "design guidelines",
          "style guide",
          "visual style",
          "visual design rules",
          "design rules",
          "design guidance from screenshot",
          "design guidance from mockup",
          "document mockup design",
          "document screenshot design",
          "design system docs"
        ]
      },
      "prompt": {
        "description": "Frontend design-standard authoring for creating or refreshing `docs/DESIGN.md` from user descriptions, attached images or mockups, existing frontend files, or current design docs. Use when the agent needs to extract, normalize, or rewrite shared UI style guidance for future `b-frontend` implementation. Unlike `b-frontend`, it writes design guidance rather than UI code; unlike b-browser, it does not collect final browser evidence."
      }
    },
    {
      "name": "b-frontend",
      "phase": "Build",
      "use": "Implement contextual frontend/UI code, styling, responsive behavior, interactions, visual refreshes, and landing pages",
      "routing": {
        "intent": "Clearly scoped frontend/UI code implementation or visual refresh (pages, layouts, components, responsiveness, interactions)",
        "triggers": [
          "frontend implementation",
          "UI implementation",
          "page implementation",
          "layout implementation",
          "component implementation",
          "component styling",
          "responsive behavior",
          "responsive layout",
          "UI interaction",
          "interaction state",
          "visual refresh",
          "landing page",
          "landing-page"
        ]
      },
      "prompt": {
        "description": "Context-aware frontend/UI implementation for pages, layouts, components, styling, responsive behavior, interactions, and visual refreshes. Uses existing product tokens, components, assets, and design guidance without inventing a generic aesthetic, and hands browser/visual proof to b-browser."
      }
    },
    {
      "name": "b-diagram",
      "phase": "Build",
      "use": "Create validated, portable technical architecture and flow diagrams from explicit facts",
      "routing": {
        "intent": "Create a technical architecture, system map, workflow, sequence, data-flow, or lifecycle diagram",
        "triggers": [
          "architecture diagram",
          "system map",
          "workflow diagram",
          "sequence diagram",
          "data-flow diagram",
          "lifecycle diagram"
        ]
      },
      "prompt": {
        "description": "Create validated, portable architecture, workflow, sequence, data-flow, and lifecycle diagrams from explicit facts. Produces versioned JSON source and self-contained HTML/SVG without inferring topology, ownership, runtime behavior, impact, or merge safety."
      }
    },
    {
      "name": "b-implement",
      "phase": "Build",
      "use": "Make the scoped non-UI change from an approved plan or a small direct request",
      "routing": {
        "intent": "Implement approved or clearly scoped non-UI work (general fallback)",
        "triggers": [
          "implement",
          "make the change",
          "apply the plan",
          "code the fix",
          "finish the implementation",
          "build the feature"
        ]
      },
      "prompt": {
        "description": "Execute approved or scoped non-UI work safely after b-plan approval, when a user gives a small direct request or an approved plan. Applies the next small step, verifies it, and hands back to planning or research instead of guessing when new ambiguity appears. Frontend/UI code\u2014pages, layouts, components, styling, responsive behavior, interactions, or visual refreshes\u2014belongs to b-frontend instead. Unlike b-plan, b-implement changes code."
      }
    },
    {
      "name": "b-init",
      "phase": "Build",
      "use": "Initialize or refresh repo-local agent instruction docs",
      "routing": {
        "intent": "Initialize repo-local agent instruction files",
        "triggers": [
          "/init",
          "init agent docs",
          "initialize agent docs",
          "create AGENTS.md",
          "create CLAUDE.md",
          "refresh AGENTS.md",
          "refresh agent docs"
        ]
      },
      "prompt": {
        "description": "Initialize or refresh repo-local agent instruction docs: canonical AGENTS.md plus a minimal CLAUDE.md shim that routes readers to AGENTS.md. Grounds the docs in repo evidence, preserves user-owned content, and keeps the output slim."
      }
    },
    {
      "name": "b-refactor",
      "phase": "Build",
      "use": "Rename, extract, move, inline, simplify, or delete behavior-preserving code",
      "routing": {
        "intent": "Mechanical rename, extract, move, inline, simplify, delete dead code",
        "triggers": [
          "rename",
          "extract function",
          "extract method",
          "move symbol",
          "inline",
          "simplify code",
          "delete dead code",
          "remove dead code",
          "behavior-preserving"
        ]
      },
      "prompt": {
        "description": "Code refactoring: impact analysis, mechanical transformation, and verification for named behavior-preserving transforms: rename, extract, move, inline, delete dead code, or simplify a specific target. Vague cleanups go to b-plan first. Unlike b-plan, which decides what to build, b-refactor owns mechanical edits."
      }
    },
    {
      "name": "b-debug",
      "phase": "Decide",
      "use": "Confirm the runtime root cause and produce an evidence-backed fix handoff without editing product code",
      "routing": {
        "intent": "Runtime bug, error, \"not working\"",
        "triggers": [
          "bug",
          "broken",
          "stack trace",
          "\"not working\"",
          "runtime error",
          "regression",
          "product regression",
          "product bug",
          "diagnose"
        ]
      },
      "prompt": {
        "description": "Systematic hypothesis-driven diagnosis for runtime bugs, errors, broken behavior, slow paths, memory issues, and stack traces. Confirms root cause and produces a handoff with the exact runnable repro command, observable to flip, and confirmed causal mechanism, without editing product code. When the issue is not yet a confirmed product bug, it hands off cleanly instead of guessing. Unlike b-test, b-debug owns runtime behavior failures, not test-mechanic issues such as wrong assertions, mocks, or fixtures."
      }
    },
    {
      "name": "b-test",
      "phase": "Validate",
      "use": "Write or fix unit, integration, contract, and simulated-DOM tests",
      "routing": {
        "intent": "Unit/integration/component tests, coverage, failing tests",
        "triggers": [
          "tests",
          "coverage",
          "failing test",
          "snapshot",
          "mock",
          "component test",
          "jsdom",
          "happy-dom",
          "React Testing Library"
        ]
      },
      "prompt": {
        "description": "Test-driven development, test debugging, and test coverage evaluation. Use for writing tests, fixing failing tests, evaluating coverage, or working TDD-style. Unlike b-debug, which traces runtime bugs, b-test owns test-specific failures and simulated-DOM/component-test work: wrong assertions, missing mocks, fixture or setup issues, and coverage gaps. Real-browser, visual, browser-session, and e2e verification belongs to b-browser."
      }
    },
    {
      "name": "b-browser",
      "phase": "Validate",
      "use": "Collect real-browser, visual, screenshot, live UI, or e2e evidence",
      "routing": {
        "intent": "Real-browser, visual, and e2e verification",
        "triggers": [
          "browser",
          "e2e",
          "visual verification",
          "visual check",
          "screenshot evidence",
          "browser session",
          "live UI",
          "Playwright",
          "Cypress e2e",
          "Puppeteer",
          "WebDriver"
        ]
      },
      "prompt": {
        "description": "Browser automation and evidence operator for Playwright, Cypress e2e, Puppeteer, WebDriver, visual, screenshot, browser-session, live UI, and e2e checks. Unlike b-test, b-browser owns real-browser UI evidence, not simulated-DOM unit, integration, or contract tests."
      }
    },
    {
      "name": "b-agentic-audit",
      "phase": "Validate",
      "use": "Audit b-agentic repository conformance, health, skill/kernel quality, and currentness",
      "routing": {
        "intent": "b-agentic repository and design-conformance audit",
        "triggers": [
          "b-agentic audit",
          "suite audit",
          "maintainer audit",
          "design-conformance audit",
          "decision-design drift"
        ]
      },
      "prompt": {
        "description": "Four-dimension read-only b-agentic audit covering source/design conformance, whole-project and first-party-extension health, canonical skill/kernel quality, and currentness/MCP compatibility, with evidence thresholds and approval-gated live probing."
      }
    },
    {
      "name": "b-review",
      "phase": "Validate",
      "use": "Review changed code",
      "routing": {
        "intent": "Pre-PR changed-code review",
        "triggers": [
          "code review",
          "review diff",
          "review my diff",
          "review changes",
          "review these changes",
          "working tree diff",
          "pre-PR",
          "\"what would an architect\""
        ]
      },
      "prompt": {
        "description": "Pre-PR changed-code review for independent reads of a diff, commit range, or checkpoint after implementation. Do NOT invoke for PR-prose review, b-agentic repository or design-conformance audits, UI/design review, plan review, or research synthesis review."
      }
    },
    {
      "name": "b-commit",
      "phase": "Ship",
      "use": "Split working-tree changes into cohesive commits from an explicit user request",
      "routing": null,
      "prompt": {
        "description": "Analyze tracked, staged, and untracked working-tree changes; select cohesive commits after an explicit user request, then stage and create them on the current branch without a second approval prompt or pushing."
      }
    },
    {
      "name": "b-pr-summary",
      "phase": "Ship",
      "use": "Write commit-backed PR copy or review and rewrite supplied PR prose",
      "routing": null,
      "prompt": {
        "description": "Write an evidence-backed PR title and description from a specified count of latest local commits or commits ahead of cached origin. Also review or rewrite supplied PR copy, titles, and descriptions for clarity and supported claims, without a changed-code review gate."
      }
    }
  ]
}
