{
  "schema_version": 1,
  "format": "json-subset-of-yaml",
  "agents": {
    "b-planner": {
      "description": "Produce a read-only execution-ready plan for the main b-agentic session.",
      "model": "opus",
      "effort": "high",
      "mcp_tools": ["mcp__codegraph__codegraph_explore", "mcp__context7__resolve-library-id", "mcp__context7__query-docs"]
    },
    "b-researcher": {
      "description": "Return bounded sourced research findings to the main b-agentic session.",
      "model": "sonnet",
      "effort": "medium",
      "mcp_tools": [
        "mcp__codegraph__codegraph_explore",
        "mcp__context7__resolve-library-id",
        "mcp__context7__query-docs",
        "mcp__brave_search__brave_web_search",
        "mcp__brave_search__brave_local_search",
        "mcp__brave_search__brave_video_search",
        "mcp__brave_search__brave_image_search",
        "mcp__brave_search__brave_news_search",
        "mcp__brave_search__brave_summarizer",
        "mcp__brave_search__brave_llm_context",
        "mcp__brave_search__brave_place_search",
        "mcp__firecrawl__firecrawl_developer_search",
        "mcp__firecrawl__firecrawl_find_tools",
        "mcp__firecrawl__firecrawl_research_search_papers",
        "mcp__firecrawl__firecrawl_research_inspect_paper",
        "mcp__firecrawl__firecrawl_research_read_paper",
        "mcp__firecrawl__firecrawl_research_related_papers"
      ],
      "conditional_tools": ["mcp__firecrawl__firecrawl_search", "mcp__firecrawl__firecrawl_scrape", "mcp__firecrawl__firecrawl_map"]
    },
    "b-debugger": {
      "description": "Diagnose a runtime problem without changing product code.",
      "model": "opus",
      "effort": "high",
      "mcp_tools": ["mcp__codegraph__codegraph_explore", "mcp__context7__resolve-library-id", "mcp__context7__query-docs", "mcp__firecrawl__firecrawl_developer_search"]
    },
    "b-auditor": {
      "description": "Audit a repository read-only for the main session: b-agentic conformance or a whole-project audit.",
      "model": "opus",
      "effort": "high",
      "mcp_tools": ["mcp__codegraph__codegraph_explore", "mcp__context7__resolve-library-id", "mcp__context7__query-docs"]
    },
    "b-reviewer": {
      "description": "Independently review a frozen changed-code candidate read-only and return findings and a verdict to the main session.",
      "model": "opus",
      "effort": "high",
      "mcp_tools": ["mcp__codegraph__codegraph_explore", "mcp__context7__resolve-library-id", "mcp__context7__query-docs"]
    }
  },
  "workers": {
    "b-worker": {
      "description": "Apply one approved b-flow plan step in the main working tree and report to the main b-agentic session.",
      "model": "sonnet",
      "effort": "medium"
    }
  },
  "optional_components": {
    "datagrip": {"label": "DataGrip (b-datagrip; the DataGrip MCP entry stays user-managed)", "skills": ["b-datagrip"], "mcp_servers": ["datagrip"]},
    "excalidraw": {"label": "Excalidraw (b-excalidraw + excalidraw MCP)", "skills": ["b-excalidraw"], "mcp_servers": ["excalidraw"]},
    "drawio": {"label": "draw.io (b-drawio + drawio MCP)", "skills": ["b-drawio"], "mcp_servers": ["drawio"]},
    "notion": {"label": "Notion (notion MCP; no b-agentic skill uses it)", "skills": [], "mcp_servers": ["notion"]}
  },
  "skills": [
    {
      "name": "b-plan",
      "execution": {"mode": "subagent", "agent": "b-planner"},
      "contract": {"role": "phase", "phases": ["clarify"], "evidence": "the spec and plan JSON, which the main session writes with `b_run.py write spec` and `write plan`", "parallel_safe": true},
      "handoff": ["goal, constraints, non-goals, known decisions and prior findings; branch, HEAD, ahead/behind, and git status baseline; state gaps rather than asking the child to guess history"],
      "phase": "Decide",
      "use": "Figure out what to do when scope or approach is fuzzy, then produce an execution-ready plan",
      "argument_hint": "[goal or problem]",
      "routing": {
        "intent": "Clarify fuzzy work, compare approaches, decompose execution",
        "triggers": [
          "plan",
          "decompose",
          "approach",
          "explore",
          "not sure",
          "figure out",
          "\"how should I\"",
          "implementation plan",
          "clarify",
          "requirements",
          "scope"
        ]
      },
      "prompt": {
        "description": "Turn goals into execution-ready plans. Handles both underspecified requests and fuzzy problem statements by investigating enough to compare options, choose a path, and write ordered steps. Unlike b-implement, b-plan does not change code."
      }
    },
    {
      "name": "b-research",
      "execution": {"mode": "subagent", "agent": "b-researcher"},
      "contract": {"role": "provider", "phases": ["clarify", "implement", "fix"], "evidence": "sourced findings for the phase that asked; nothing is recorded in the run", "parallel_safe": true},
      "handoff": ["the external question and as-of date; library/runtime version pins the main session resolved from lockfiles or manifests, or the named lockfile to read when none is resolved; no local source, repository content, or private data"],
      "phase": "Decide",
      "use": "Fetch outside truth: docs, API facts, comparisons, or recent evidence",
      "argument_hint": "[question or topic]",
      "routing": {
        "intent": "External docs, API facts, versions, comparisons",
        "triggers": [
          "library docs",
          "API docs",
          "look up",
          "compare APIs",
          "versioned docs",
          "external documentation"
        ]
      },
      "prompt": {
        "description": "External knowledge, from quick lookup to multi-source synthesis, for library/framework docs, API facts, config keys, method signatures, comparisons, deep dives, or recency-sensitive topics, answered with sources. Unlike b-debug or b-plan, it fetches docs and web information rather than tracing code or choosing implementation."
      }
    },
    {
      "name": "b-design",
      "execution": {"mode": "main"},
      "contract": {"role": "provider", "phases": ["clarify", "implement"], "evidence": "`docs/DESIGN.md` guidance, a changed path inside the approved scope", "parallel_safe": false},
      "phase": "Decide",
      "use": "Create or refresh docs/DESIGN.md as a frontend design standard",
      "argument_hint": "[description, image, or files]",
      "routing": {
        "intent": "Frontend design standard and docs/DESIGN.md authoring",
        "triggers": [
          "DESIGN.md",
          "frontend design standard",
          "design guidelines",
          "style guide",
          "visual style",
          "visual design rules",
          "design rules",
          "design guidance from screenshot",
          "design guidance from mockup",
          "document mockup design",
          "document screenshot design",
          "design system docs"
        ]
      },
      "prompt": {
        "description": "Frontend design-standard authoring: create, refresh, extract, normalize, or rewrite `docs/DESIGN.md` shared UI style guidance from user descriptions, attached images or mockups, existing frontend files, or current design docs. Unlike `b-frontend`, it writes design guidance rather than UI code; unlike b-browser, it does not collect final browser evidence."
      }
    },
    {
      "name": "b-frontend",
      "execution": {"mode": "main"},
      "contract": {"role": "phase", "phases": ["implement", "fix"], "evidence": "the changed tree for a plan step (`b-state.mjs record step S-n`); in fix, dispositions in `followups.md`", "parallel_safe": false},
      "phase": "Build",
      "use": "Implement contextual frontend/UI code, styling, responsive behavior, interactions, visual refreshes, and landing pages",
      "argument_hint": "[UI change]",
      "routing": {
        "intent": "Clearly scoped frontend/UI code implementation or visual refresh (pages, layouts, components, responsiveness, interactions)",
        "triggers": [
          "frontend implementation",
          "UI implementation",
          "page implementation",
          "layout implementation",
          "component implementation",
          "component styling",
          "responsive behavior",
          "responsive layout",
          "UI interaction",
          "interaction state",
          "visual refresh",
          "landing page",
          "landing-page"
        ]
      },
      "prompt": {
        "description": "Context-aware frontend/UI implementation for pages, layouts, components, styling, responsive behavior, interactions, and visual refreshes. Uses existing product tokens, components, assets, and design guidance without inventing a generic aesthetic, and hands browser/visual proof to b-browser."
      }
    },
    {
      "name": "b-excalidraw",
      "execution": {"mode": "main"},
      "contract": {"role": "utility"},
      "phase": "Build",
      "use": "Sketch conceptual, whiteboard, and explanatory diagrams in Excalidraw from explicit facts",
      "argument_hint": "[diagram type and facts]",
      "routing": {
        "intent": "Sketch a conceptual, whiteboard, or explanatory diagram",
        "triggers": [
          "architecture diagram",
          "system map",
          "workflow diagram",
          "data-flow diagram",
          "lifecycle diagram",
          "whiteboard sketch",
          "brainstorm diagram",
          "Excalidraw diagram"
        ]
      },
      "prompt": {
        "description": "Sketch conceptual, whiteboard, and explanatory architecture, workflow, data-flow, and lifecycle diagrams in Excalidraw through the Excalidraw MCP from explicit facts, without inferring topology, ownership, runtime behavior, impact, or merge safety. Formal, icon-based, ER/UML, sequence, or editable .drawio diagrams belong to b-drawio. Never produces HTML or SVG."
      }
    },
    {
      "name": "b-drawio",
      "execution": {"mode": "main"},
      "contract": {"role": "utility"},
      "phase": "Build",
      "use": "Draw formal or editable technical diagrams in draw.io from explicit facts",
      "argument_hint": "[diagram type, facts, and .drawio path]",
      "routing": {
        "intent": "Formal or editable draw.io diagram (cloud/network icons, ER/UML, sequence, .drawio files)",
        "triggers": [
          "draw.io diagram",
          "drawio",
          ".drawio file",
          "network topology diagram",
          "cloud architecture diagram",
          "ER diagram",
          "UML diagram",
          "class diagram",
          "sequence diagram"
        ]
      },
      "prompt": {
        "description": "Draw formal or editable technical diagrams in draw.io from explicit facts, such as cloud or network topology with official icons, ER and UML models, sequence diagrams, dense or multi-page flowcharts, and repository .drawio files, without inferring topology, ownership, runtime behavior, impact, or merge safety. Conceptual whiteboard sketches belong to b-excalidraw. Never produces HTML or SVG."
      }
    },
    {
      "name": "b-implement",
      "execution": {"mode": "main"},
      "contract": {"role": "phase", "phases": ["implement", "fix"], "evidence": "the changed tree for a plan step (`b-state.mjs record step S-n`); in fix, dispositions in `followups.md`", "parallel_safe": false},
      "phase": "Build",
      "use": "Make the scoped non-UI change from an approved plan or a small direct request",
      "argument_hint": "[approved plan or change]",
      "routing": {
        "intent": "Implement approved or clearly scoped non-UI work (general fallback)",
        "triggers": [
          "implement",
          "make the change",
          "apply the plan",
          "code the fix",
          "finish the implementation",
          "build the feature"
        ]
      },
      "prompt": {
        "description": "Execute approved or scoped non-UI work from an approved plan or a small direct request, one verified step at a time, handing back to planning or research when new ambiguity appears. Frontend/UI code belongs to b-frontend. Unlike b-plan, b-implement changes code."
      }
    },
    {
      "name": "b-datagrip",
      "execution": {"mode": "main"},
      "contract": {"role": "utility"},
      "phase": "Build",
      "use": "Inspect and query DataGrip databases safely through the DataGrip MCP",
      "argument_hint": "[connection and question]",
      "routing": {
        "intent": "Inspect or query DataGrip-configured databases through the DataGrip MCP",
        "triggers": [
          "DataGrip",
          "DataGrip connection",
          "DataGrip database",
          "DataGrip schema",
          "run SQL in DataGrip"
        ]
      },
      "prompt": {
        "description": "Inspect and query DataGrip-configured databases through the DataGrip MCP with read-only SQL by default, explicit row limits, named-connection confirmation for remote databases, and approval before any write, DDL, or connection change. Use for schema inspection, table previews, and ad-hoc SQL; unlike b-implement and b-debug, it does not edit application code or diagnose runtime failures."
      }
    },
    {
      "name": "b-init",
      "execution": {"mode": "main"},
      "contract": {"role": "utility"},
      "phase": "Build",
      "use": "Initialize or refresh repo-local agent instruction docs",
      "routing": {
        "intent": "Initialize repo-local agent instruction files",
        "triggers": [
          "/init",
          "init agent docs",
          "initialize agent docs",
          "create AGENTS.md",
          "create CLAUDE.md",
          "refresh AGENTS.md",
          "refresh agent docs"
        ]
      },
      "prompt": {
        "description": "Initialize or refresh repo-local agent instruction docs: canonical AGENTS.md plus a minimal CLAUDE.md shim that routes readers to AGENTS.md, grounded in repo evidence with user-owned content preserved. Also sets up the docs/ structure: a docs/README.md index and a README in each docs folder for agent-authored docs."
      }
    },
    {
      "name": "b-refactor",
      "execution": {"mode": "main"},
      "contract": {"role": "phase", "phases": ["implement", "fix"], "evidence": "the changed tree for a plan step (`b-state.mjs record step S-n`); in fix, dispositions in `followups.md`", "parallel_safe": false},
      "phase": "Build",
      "use": "Rename, extract, move, inline, simplify, or delete behavior-preserving code",
      "argument_hint": "<transform and target>",
      "routing": {
        "intent": "Mechanical rename, extract, move, inline, simplify, delete dead code",
        "triggers": [
          "rename",
          "extract function",
          "extract method",
          "move symbol",
          "inline",
          "simplify code",
          "delete dead code",
          "remove dead code",
          "behavior-preserving"
        ]
      },
      "prompt": {
        "description": "Code refactoring: impact analysis, mechanical transformation, and verification for named behavior-preserving transforms: rename, extract, move, inline, delete dead code, or simplify a specific target. Vague cleanups go to b-plan first. Unlike b-plan, which decides what to build, b-refactor owns mechanical edits."
      }
    },
    {
      "name": "b-debug",
      "execution": {"mode": "subagent", "agent": "b-debugger"},
      "contract": {"role": "provider", "phases": ["clarify", "fix", "qa"], "evidence": "the confirmed cause, the repro command, and the observable to flip; nothing is recorded in the run", "parallel_safe": true},
      "handoff": ["repro command, observed output, expected behavior, and environment; state gaps rather than asking the child to run state-changing probes"],
      "phase": "Decide",
      "use": "Confirm the runtime root cause and produce an evidence-backed fix handoff without editing product code",
      "argument_hint": "[repro command or error]",
      "routing": {
        "intent": "Runtime bug, error, \"not working\"",
        "triggers": [
          "bug",
          "broken",
          "stack trace",
          "\"not working\"",
          "runtime error",
          "regression",
          "product regression",
          "product bug",
          "diagnose"
        ]
      },
      "prompt": {
        "description": "Hypothesis-driven diagnosis for runtime bugs, errors, broken behavior, slow paths, memory issues, and stack traces. Confirms the root cause and hands off an evidence-backed fix without editing product code. Unlike b-test, b-debug owns runtime behavior failures, not test-mechanic issues such as wrong assertions, mocks, or fixtures."
      }
    },
    {
      "name": "b-test",
      "execution": {"mode": "main"},
      "contract": {"role": "phase", "phases": ["implement", "fix"], "evidence": "the changed tree for a plan step (`b-state.mjs record step S-n`); in fix, dispositions in `followups.md`", "parallel_safe": false},
      "phase": "Validate",
      "use": "Write or fix unit, integration, contract, and simulated-DOM tests",
      "argument_hint": "[test target or failure]",
      "routing": {
        "intent": "Unit/integration/component tests, coverage, failing tests",
        "triggers": [
          "tests",
          "coverage",
          "failing test",
          "snapshot",
          "mock",
          "component test",
          "jsdom",
          "happy-dom",
          "React Testing Library"
        ]
      },
      "prompt": {
        "description": "Test-driven development, writing or debugging tests, fixing failing tests, and evaluating coverage. Unlike b-debug, which traces runtime bugs, b-test owns test-specific failures and simulated-DOM/component-test work: wrong assertions, missing mocks, fixture or setup issues, and coverage gaps. Real-browser, visual, browser-session, and e2e verification belongs to b-browser."
      }
    },
    {
      "name": "b-browser",
      "execution": {"mode": "main"},
      "contract": {"role": "provider", "phases": ["verify", "qa"], "evidence": "real-browser evidence for a criterion, cited as the source of its `qa.md` row", "parallel_safe": false},
      "phase": "Validate",
      "use": "Collect real-browser, visual, screenshot, live UI, or e2e evidence",
      "argument_hint": "[route and UI state]",
      "routing": {
        "intent": "Real-browser, visual, and e2e verification",
        "triggers": [
          "browser",
          "e2e",
          "visual verification",
          "visual check",
          "screenshot evidence",
          "browser session",
          "live UI",
          "Playwright",
          "Cypress e2e",
          "Puppeteer",
          "WebDriver"
        ]
      },
      "prompt": {
        "description": "Browser automation and evidence operator for Playwright, Cypress e2e, Puppeteer, WebDriver, visual, screenshot, browser-session, live UI, and e2e checks. Unlike b-test, b-browser owns real-browser UI evidence, not simulated-DOM unit, integration, or contract tests."
      }
    },
    {
      "name": "b-agentic-audit",
      "execution": {"mode": "subagent", "agent": "b-auditor"},
      "contract": {"role": "utility"},
      "handoff": ["after approved origin fetch, branch/upstream and HEAD ahead/behind counts (both zero required)", "status and scripts/b-agentic-audit.sh output; installed versions and approved live-probe results when available"],
      "phase": "Validate",
      "use": "Audit b-agentic repository conformance, health, skill/kernel quality, and currentness",
      "routing": {
        "intent": "b-agentic repository and design-conformance audit",
        "triggers": [
          "b-agentic audit",
          "suite audit",
          "maintainer audit",
          "design-conformance audit",
          "decision-design drift"
        ]
      },
      "prompt": {
        "description": "Four-dimension read-only b-agentic audit covering source/design conformance, whole-project and first-party hook and CLI health, canonical skill/kernel quality, and currentness/MCP compatibility, with evidence thresholds and approval-gated live probing."
      }
    },
    {
      "name": "b-audit",
      "execution": {"mode": "subagent", "agent": "b-auditor"},
      "contract": {"role": "utility"},
      "handoff": ["after approved origin fetch, branch/upstream and HEAD ahead/behind counts (both zero required)", "status, user-named scope and dimensions, paths of the repo's own instruction/decision docs (AGENTS.md, CLAUDE.md, README, ADRs), and output of its documented verification commands; manifest/lockfile names and installed versions when available; approved advisory-scan output when run"],
      "phase": "Validate",
      "use": "Audit the current project for defects, dependency currentness, architecture drift, test gaps, and docs drift",
      "argument_hint": "[scope or dimensions]",
      "routing": {
        "intent": "Whole-project audit of the current repository",
        "triggers": [
          "project audit",
          "codebase audit",
          "audit this project",
          "audit this repo",
          "dependency currentness"
        ]
      },
      "prompt": {
        "description": "Read-only whole-project audit of the current repository across correctness/security defects, dependency currentness, architecture and boundary drift, test and verification gaps, and docs/instruction drift, with evidence thresholds and approval-gated advisory scans. Unlike b-agentic-audit, it audits any repository against its own documented standards."
      }
    },
    {
      "name": "b-review",
      "execution": {"mode": "subagent", "agent": "b-reviewer"},
      "contract": {"role": "phase", "phases": ["review"], "evidence": "the round's findings in `followups.md`, then the verdict and gate (`b-state.mjs record review --gate`)", "parallel_safe": true},
      "primary_gate": {
        "runtimes": ["claude", "antigravity"],
        "label": "Codex",
        "note": "`b-review` first runs Codex (openai/codex-plugin-cc) through `b-codex-review` from the main session; `b-reviewer` runs when that wrapper exits 4 (Codex unavailable) or by the user's choice after a refused or void run."
      },
      "handoff": [
        "baseline (branch, HEAD, ahead/behind, git status) and the review target: the working tree, or a base ref the main session resolved to a commit id",
        "the review round number (1 for a first review; it prefixes finding IDs), acceptance criteria, fresh required-check results, the kernel risk triggers that apply, and the exact candidate paths",
        "the frozen candidate fingerprint F0 from `bun --no-env-file --config=/dev/null ~/.claude/b-agentic/bin/b-candidate-snapshot.mjs` and every relevant ignored/derived path to pass as `--include-ignored`; never the implementer's rationale or a verdict to confirm",
        "for a re-review: prior finding IDs, dispositions, correction paths, the main session's sibling-sweep scope, and regression-check results"
      ],
      "phase": "Validate",
      "use": "Review changed code",
      "argument_hint": "[working tree or changes since a base ref]",
      "routing": {
        "intent": "Pre-PR changed-code review",
        "triggers": [
          "code review",
          "review diff",
          "review my diff",
          "review changes",
          "review these changes",
          "working tree diff",
          "pre-PR",
          "\"what would an architect\""
        ]
      },
      "prompt": {
        "description": "Pre-PR changed-code review for architect-style reads of working-tree changes or changes since a base ref after implementation. Do NOT invoke for PR-prose review, b-agentic repository or design-conformance audits, UI/design review, plan review, or research synthesis review."
      }
    },
    {
      "name": "b-qa",
      "execution": {"mode": "main"},
      "contract": {"role": "phase", "phases": ["qa"], "evidence": "the `qa.md` matrix, then each criterion and the verdict (`b-state.mjs record ac`, `record qa`)", "parallel_safe": true},
      "phase": "Validate",
      "use": "Check a reviewed candidate against its acceptance criteria with fresh evidence and a QA verdict",
      "argument_hint": "[acceptance criteria or candidate]",
      "routing": {
        "intent": "Post-review acceptance QA: criterion-to-evidence matrix and QA verdict",
        "triggers": [
          "QA",
          "QA gate",
          "acceptance QA",
          "acceptance check",
          "verify acceptance criteria",
          "evidence matrix",
          "regression scope"
        ]
      },
      "prompt": {
        "description": "Post-review acceptance QA for a reviewed, fingerprinted candidate: maps every acceptance criterion to fresh evidence, hands test work to b-test, real-browser evidence to b-browser, and product failures to b-debug, and ends with QA PASS, QA FAIL, or QA BLOCKED. Unlike b-review, it checks acceptance rather than code quality; it never commits or pushes."
      }
    },
    {
      "name": "b-flow",
      "execution": {"mode": "main"},
      "contract": {"role": "orchestrator"},
      "phase": "Build",
      "use": "Run a change as a quick or full run with file-backed state, artifacts, and evidence",
      "argument_hint": "[goal | resume]",
      "routing": {
        "intent": "Changes that route to b-implement, b-frontend, b-refactor, or b-test",
        "entry": true
      },
      "prompt": {
        "description": "Run a change request as one resumable run in the main session, with state, artifacts, and evidence in .b-agentic/runs. A quick run, for a small and clear change, takes the request as its approval and never commits. A full run clarifies, takes one user approval, then implements, reviews, runs QA, and commits only under the consent recorded at approval. It never pushes or opens a PR. The kernel routes implement-phase changes here; /b-flow starts or resumes a run explicitly. A large or still-open request is discussed first; a run starts only on the user's go."
      }
    },
    {
      "name": "b-commit",
      "execution": {"mode": "main"},
      "contract": {"role": "phase", "phases": ["commit"], "evidence": "the commits of the approved candidate (`b-state.mjs record commit`)", "parallel_safe": false},
      "phase": "Ship",
      "use": "Split working-tree changes into cohesive commits from an explicit user request",
      "argument_hint": "[commit instructions]",
      "routing": {
        "intent": "Split and commit working-tree changes",
        "explicit_request": true
      },
      "prompt": {
        "description": "Analyze tracked, staged, and untracked working-tree changes; select cohesive commits after an explicit user request, ask once whether to commit on the current branch or a new `<type>/<kebab>` branch, then stage and create them without pushing."
      }
    },
    {
      "name": "b-pr",
      "execution": {"mode": "main"},
      "contract": {"role": "utility"},
      "phase": "Ship",
      "use": "Push the current branch and open a draft PR from its commits",
      "argument_hint": "[base branch]",
      "routing": {
        "intent": "Push the current branch and open a draft PR",
        "explicit_request": true
      },
      "prompt": {
        "description": "Push the current branch to origin and create a draft GitHub PR from its commits with git and gh, after an explicit user request. Writes the title and description from commit evidence, asks for the base branch when it is ambiguous, and reports only the pushed branch and the PR URL."
      }
    }
  ]
}
