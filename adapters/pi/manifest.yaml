  "permissions": {"mechanism": "first-party tool_call extensions with full shell tokenization", "data": "references/permissions.yaml"},
  "hook": {"event": "tool_call", "blocking": true, "fails_closed_without_ui": true},
  "installer": "adapters/pi/scripts/install.sh",
  "evidence": "docs/hosts.md"
}
