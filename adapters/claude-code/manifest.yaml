{
  "schema_version": 1,
  "host": "claude-code",
  "status": "shipped",
  "display_name": "Claude Code",
  "description": "Declarative configuration adapter: skills, kernel, MCP config, and host-native permission rules. No hooks or packages.",
  "instruction": {"path": "CLAUDE.md", "source": "references/kernel.template.md", "scope": "project+global"},
  "skills": {"dir": ".claude/skills/<name>/SKILL.md", "source": "skills/", "note": "also read by OpenCode; see coexistence in docs/hosts.md"},
  "mcp": {"path": ".mcp.json (project root)", "key": "mcpServers", "personal": "~/.claude.json"},
  "permissions": {"mechanism": "settings.json permissions.allow/ask/deny", "matching": "compound-command-aware, first match wins", "data": "references/permissions.yaml"},
  "hook": {"event": "PreToolUse", "blocking": "exit 2 blocks", "note": "documented capability only; v1 ships no hook scripts"},
  "installer": "adapters/claude-code/scripts/install.sh",
  "payload": ["configs", "scripts"],
  "evidence": "docs/hosts.md"
}
