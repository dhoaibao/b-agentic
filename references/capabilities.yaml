      "fallback": "Continue with the active session and report that compaction continuity is unavailable.",
      "status_signal": {
        "source": "local-package-listing",
        "states": ["installed", "missing", "unknown"],
        "description": "Reports only local package presence; it does not persist or expose prompts, memory contents, or usage telemetry.",
