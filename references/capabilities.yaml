{
  "schema_version": 2,
  "format": "json-subset-of-yaml",
  "description": "Canonical activation contract for managed Pi capabilities. Status is local and non-sensitive; it never claims authentication, external verification, or usage unless a separate approved operation proves it.",
  "capabilities": [
    {
      "id": "package.pi-mcp-adapter",
      "hosts": ["pi"],
      "kind": "package",
      "purpose": "Load Pi MCP configuration and expose managed servers through the adapter proxy.",
      "owner": "Pi MCP adapter",
      "trigger": "Use when a task needs a configured managed MCP server; do not invoke it for unrelated local work.",
      "prerequisites": ["Pi CLI", "Pi MCP configuration"],
      "readiness": "The package is present in the local Pi package listing.",
      "fallback": "Use native repository tools or report that managed MCP access is unavailable.",
      "status_signal": {
        "source": "local-package-listing",
        "states": ["installed", "missing", "unknown"],
        "description": "Reports only local package presence; it does not report authentication, server health, or session usage.",
        "sensitive": false
      },
      "probe": {"type": "package", "name": "pi-mcp-adapter"},
      "package": {"name": "pi-mcp-adapter", "spec": "npm:pi-mcp-adapter"},
      "install_state": {"action": "mcpAdapterAction", "state": "mcpAdapterState"},
      "source": {"installer": "adapters/pi/scripts/install.sh"}
    },
    {
