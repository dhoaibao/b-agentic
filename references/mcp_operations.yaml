{
  "schema_version": 1,
  "format": "json-subset-of-yaml",
  "description": "Canonical managed MCP operation classification. Classified read-only and safe conditional-read operations are auto-approved through adapter-owned calls and unambiguous top-level mcp gateway calls. Skills do not alter active tools or MCP approval policy; prompt-level guidance directs solo execution.",
  "classes": {
    "read-only": {
      "policy": "Auto-approved for managed servers",
      "notes": "Gateway observations; server/classified tool required."
    },
    "conditional-read": {
      "policy": "Auto-approved for safe arguments",
      "notes": "Gate mutation/local access/arbitrary output."
    },
    "conditional-local": {
      "policy": "Auto-approved inside current project",
      "notes": "Repo-confined edits; unsafe paths gated."
    },
    "local-upload": {
      "policy": "Approval required",
      "notes": "Reads local files for remote use"
    },
    "external-mutation": {
      "policy": "Approval required",
      "notes": "Remote state changes."
    },
    "monitor-lifecycle": {
      "policy": "Approval required",
      "notes": "Firecrawl monitor ops."
    },
    "local-mutation": {
      "policy": "Approval required",
      "notes": "Mutates local repo/agent state"
    },
    "auth": {
      "policy": "Approval required",
      "notes": "MCP auth"
    }
  },
