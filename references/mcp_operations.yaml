  "mcpScript": {
    "purpose": "bounded multi-call MCP orchestration; not a general scripting or isolation boundary",
    "max_total_operations": 12,
    "max_tool_calls": 8,
    "max_sources_or_routes": 3,
    "max_results_per_source": 5,
    "max_normalized_records": 12,
    "max_primary_scrapes": 1,
    "allowed_operations": ["tools.search", "tools.describe", "tools.call"],
    "result_envelope": {
      "success": ["ok", "data"],
      "failure": ["ok", "error"],
      "content_block_types": ["text", "image", "audio", "resource", "resource_link"],
      "normalized_fields": ["title", "url", "claim", "error"],
      "deduplicate_by": ["url", "title+claim"],
      "partial_failure": "Return bounded partial results with explicit errors; never claim complete coverage."
    },
    "fallback": "If the manual mcp-scripting skill is unavailable, use direct top-level mcp calls and state the fallback; use mcpScript only when this contract can be followed."
  },
  "conditional_arguments": {
    "firecrawl:firecrawl_search": {
      "known": ["query", "limit", "tbs", "filter", "location", "includeDomains", "excludeDomains", "sources", "categories", "scrapeOptions", "enterprise", "highlights"]
    },
    "firecrawl:firecrawl_scrape": {
      "known": ["url", "formats", "jsonOptions", "queryOptions", "screenshotOptions", "parsers", "pdfOptions", "onlyMainContent", "redactPII", "includeTags", "excludeTags", "waitFor", "actions", "mobile", "skipTlsVerification", "removeBase64Images", "location", "storeInCache", "zeroDataRetention", "maxAge", "lockdown", "proxy", "profile"]
    },
    "firecrawl:firecrawl_map": {
      "known": ["url", "search", "sitemap", "includeSubdomains", "limit", "ignoreQueryParameters"]
    },
    "firecrawl:firecrawl_extract": {
      "known": ["urls", "prompt", "schema", "allowExternalLinks", "enableWebSearch", "includeSubdomains"]
    },
    "playwright:browser_snapshot": {
      "known": ["target", "filename", "depth", "boxes"]
    },
    "playwright:browser_console_messages": {
      "known": ["level", "all", "filename"]
    },
    "playwright:browser_network_requests": {
      "known": ["static", "filter", "filename"]
    },
    "playwright:browser_network_request": {
      "known": ["index", "part", "filename"]
    },
    "playwright:browser_tabs": {
      "known": ["action", "index", "url"]
    },
    "playwright:browser_verify_element_visible": {
      "known": ["accessibleName", "role"]
    },
    "playwright:browser_verify_list_visible": {
      "known": ["element", "items", "target"]
    },
    "playwright:browser_verify_text_visible": {
      "known": ["text"]
    },
    "playwright:browser_verify_value": {
      "known": ["element", "target", "type", "value"]
    }
  },
  "runtime_enforcement": {
    "pi": "The adapter approval broker and Pi tool_call trust classified safe operations. The top-level mcp gateway requires an explicit managed server and matching tool name; conditional tools also require validated arguments. mcpScript permits tools.search/tools.describe metadata and nested tools.call retains normal approval/auth/output-guard policy. It is a bounded multi-call surface, not a general scripting or isolation boundary: follow the mcpScript contract above, do not batch browser mutations, and do not use unapproved nested calls. Auth, lifecycle, UI actions, selector mixtures, unclassified tools, unmanaged servers, and local/external mutations remain blocked. Validation requires runtime safe sets to match this policy."
  }
}
