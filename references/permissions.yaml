{
  "schema_version": 1,
  "format": "json-subset-of-yaml",
  "description": "Canonical portable permission data shared by every host adapter. Command patterns are ordered token prefixes matched against the shell command tokens; protected path markers are substring or path-segment markers. Host adapters emit this data in their native ordering and syntax; only the Pi adapter adds full shell tokenization on top. Documented per host in docs/hosts.md.",
  "ask_commands": [
    ["git", "push"],
    ["git", "pull"],
    ["rm", "-rf"],
    ["rm", "-fr"]
  ],
  "deny_commands": [
    ["git", "reset", "--hard"],
    ["git", "clean", "-f"],
    ["git", "push", "--force"],
    ["git", "push", "--force-with-lease"],
    ["git", "branch", "-D"],
    ["docker", "system", "prune"],
    ["docker", "volume", "rm"]
  ],
  "service_commands": [
    ["docker", "compose", "up"],
    ["docker-compose", "up"],
    ["npm", "run", "dev"],
    ["pnpm", "dev"],
    ["yarn", "dev"],
    ["bun", "run", "dev"],
    ["cargo", "watch"]
  ],
  "dangerous_ask_commands": [
    ["dd"],
    ["mkfs"],
    ["chmod"],
    ["chown"],
    ["kill"],
    ["pkill"],
    ["killall"],
    ["shutdown"],
    ["reboot"],
    ["poweroff"],
    ["halt"],
    ["systemctl", "stop"],
    ["systemctl", "restart"],
    ["systemctl", "disable"],
    ["docker", "rm"],
    ["docker", "container", "rm"],
    ["docker", "image", "rm"],
    ["docker", "compose", "down"],
    ["kubectl", "delete"]
  ],
  "protected_path_markers": [
    ".env",
    ".envrc",
    "credentials.",
    "secrets.",
    ".pem",
    ".key",
    ".p12",
    ".pfx",
    ".npmrc",
    ".netrc",
    ".pypirc",
    ".git-credentials",
    ".ssh/",
    ".config/gh/",
    ".aws/",
    ".kube/",
    "/.git/",
    ".git/",
    "id_rsa",
    "id_ed25519",
    "id_ecdsa",
    "id_dsa"
  ]
}
